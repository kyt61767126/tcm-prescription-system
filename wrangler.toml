name = "tcm-prescription-system"
pages_build_output_dir = "public"

[[kv_namespaces]]
binding = "KV"
id = "b1ab3e4b683341958cef369fcbf94933"

# ★ 2026-09-10 D1 数据库绑定（处方表迁移 P0）
#   需在 Cloudflare 后台创建 D1 数据库后，将 database_id 填入下方。
#   创建命令：wrangler d1 create tcm-prescriptions-db
#   建表命令：wrangler d1 execute tcm-prescriptions-db --file=functions/api/_lib/schema.sql
#   本地测试：wrangler d1 execute tcm-prescriptions-db --local --file=functions/api/_lib/schema.sql
[[d1_databases]]
binding = "DB"
database_name = "tcm-prescriptions-db"
database_id = "e74894e3-dafc-491f-8777-d2ee9962e677"

# 环境变量（Cloudflare Pages 部署时使用）
# AUTH_TOKEN_TTL_HOURS: Bearer token 有效期（小时），默认 168（7 天）
# USE_D1: 是否启用 D1 存储处方（true=D1优先+KV双写，false=仅KV）
[vars]
AUTH_TOKEN_TTL_HOURS = "8"
USE_D1 = "true"
