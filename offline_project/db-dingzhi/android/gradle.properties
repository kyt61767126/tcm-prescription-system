# Project-wide Gradle settings.

# JVM arguments - G1GC for parallel GC, larger heap for faster builds
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true
android.overridePathCheck=true
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.19.10-hotspot
java.toolchain.languageVersion=17

# Performance optimizations
# Enable parallel builds (multiple modules build concurrently)
org.gradle.parallel=true
# Enable daemon (keeps JVM warm between builds - 2-3x faster)
org.gradle.daemon=true
# Enable build cache (reuses task outputs)
org.gradle.caching=true
# Enable configuration cache (Gradle 8+)
org.gradle.configuration-cache=true
# Configure on-demand (only configure relevant projects)
org.gradle.configureondemand=true
# Increase worker count (default is processor count)
org.gradle.workers.max=4
