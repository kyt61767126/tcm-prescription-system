<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>软件激活</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #333;
    padding: 30px 24px;
    font-size: 14px;
    user-select: none;
}
.container { max-width: 420px; margin: 0 auto; }
h1 {
    color: #2c3e50;
    font-size: 20px;
    text-align: center;
    margin-bottom: 8px;
}
.subtitle {
    color: #909399;
    font-size: 12px;
    text-align: center;
    margin-bottom: 24px;
}
.form-group { margin-bottom: 16px; }
.form-group label {
    display: block;
    margin-bottom: 6px;
    color: #606266;
    font-weight: 500;
    font-size: 13px;
}
.form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dcdfe6;
    border-radius: 4px;
    font-size: 14px;
    font-family: "Courier New", monospace;
    letter-spacing: 1px;
    transition: border-color 0.2s;
    user-select: text;
}
.form-group input:focus {
    border-color: #3498db;
    outline: none;
    box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
}
.form-group input::placeholder {
    color: #c0c4cc;
    letter-spacing: 0;
}
.btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.2s;
    margin-top: 8px;
}
.btn:hover { background: #2980b9; }
.btn:active { background: #21618c; }
.btn:disabled {
    background: #bdc3c7;
    cursor: not-allowed;
}
.btn-secondary {
    background: #95a5a6;
    margin-top: 8px;
}
.btn-secondary:hover { background: #7f8c8d; }

.status-box {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 13px;
    display: none;
}
.status-box.show { display: block; }
.status-box.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}
.status-box.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
.status-box.loading {
    background: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
}

.info-box {
    margin-top: 20px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 4px;
    font-size: 12px;
    color: #856404;
    line-height: 1.6;
}
.info-box strong { color: #9c640c; }

.machine-id-box {
    margin-top: 16px;
    padding: 8px 12px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    font-size: 11px;
    color: #909399;
    font-family: "Courier New", monospace;
    word-break: break-all;
    user-select: text;
}
.machine-id-box .label {
    color: #606266;
    font-weight: 500;
    margin-bottom: 4px;
    font-family: inherit;
    font-size: 11px;
}
</style>
</head>
<body>
<div class="container">
    <h1>软件激活</h1>
    <div class="subtitle">请输入激活码以继续使用</div>

    <div id="statusBox" class="status-box"></div>

    <div class="form-group">
        <label>激活码</label>
        <input type="text" id="activationCode" placeholder="BNZC-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    </div>

    <div class="form-group">
        <label>用户名（可选）</label>
        <input type="text" id="userName" placeholder="留空则使用激活码绑定的用户名" autocomplete="off">
    </div>

    <button class="btn" id="activateBtn" onclick="submitActivate()">激活</button>
    <button class="btn btn-secondary" onclick="closeWindow()">取消</button>

    <div class="machine-id-box">
        <div class="label">本机机器 ID（联系管理员时提供）：</div>
        <div id="machineId">加载中...</div>
    </div>

    <div class="info-box">
        <strong>激活说明：</strong><br>
        1. 请联系管理员获取激活码<br>
        2. 激活码格式：BNZC-XXXX-XXXX-XXXX-XXXX<br>
        3. 每个激活码绑定一台设备，换机需联系管理员解绑<br>
        4. 激活成功后软件将自动重启<br>
        5. 如无法联网，请联系管理员获取离线激活文件
    </div>
</div>

<script>
// 从 URL 参数获取机器 ID
const params = new URLSearchParams(window.location.search);
document.getElementById('machineId').textContent = params.get('machineId') || '未知';

// 自动格式化激活码输入
document.getElementById('activationCode').addEventListener('input', function(e) {
    let val = e.target.value.toUpperCase().replace(/[^A-HJ-NP-Z2-9-]/g, '');
    // 自动添加连字符
    const clean = val.replace(/-/g, '');
    if (clean.length > 4) {
        const groups = [];
        for (let i = 0; i < clean.length && i < 20; i += 4) {
            groups.push(clean.substring(i, i + 4));
        }
        val = groups.join('-');
    }
    e.target.value = val;
});

// 回车键激活
document.getElementById('activationCode').addEventListener('keyup', e => {
    if (e.key === 'Enter') document.getElementById('userName').focus();
});
document.getElementById('userName').addEventListener('keyup', e => {
    if (e.key === 'Enter') submitActivate();
});

function showStatus(message, type) {
    const box = document.getElementById('statusBox');
    box.className = 'status-box show ' + type;
    box.textContent = message;
}

async function submitActivate() {
    const code = document.getElementById('activationCode').value.trim();
    const user = document.getElementById('userName').value.trim();

    if (!code) {
        showStatus('请输入激活码', 'error');
        return;
    }

    // 校验格式
    const pattern = /^BNZC-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/;
    if (!pattern.test(code)) {
        showStatus('激活码格式错误，应为 BNZC-XXXX-XXXX-XXXX-XXXX', 'error');
        return;
    }

    const btn = document.getElementById('activateBtn');
    btn.disabled = true;
    btn.textContent = '激活中...';
    showStatus('正在连接服务器验证激活码...', 'loading');

    try {
        const result = await window.electronAPI.activate.submit(code, user);
        if (result.success) {
            showStatus('激活成功！软件将自动重启...', 'success');
            btn.textContent = '激活成功';
            // 给用户一点时间看到成功提示
            setTimeout(() => {
                window.electronAPI.activate.restart();
            }, 1500);
        } else {
            showStatus(result.error || '激活失败', 'error');
            btn.disabled = false;
            btn.textContent = '激活';
        }
    } catch (e) {
        showStatus('激活过程出错：' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = '激活';
    }
}

function closeWindow() {
    window.electronAPI.activate.close();
}
</script>
</body>
</html>
