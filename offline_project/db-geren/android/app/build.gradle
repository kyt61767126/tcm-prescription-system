apply plugin: 'com.android.application'

// Fix javac Chinese output garbled text: force UTF-8 for source parsing and compile messages
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.forkOptions.jvmArgs += ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8', '-Duser.language=en', '-Duser.country=US']
}
def signingProperties = new Properties()
def signingPropertiesFile = file('signing.properties')
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

// 构建时间戳（北京时间），用于 APP 内显示打包时间
// 注意：doFirst 内禁止调用 Project.file() 等 script 方法（configuration-cache 不支持）
// 在配置阶段捕获项目绝对路径（String 可序列化），doFirst 内用 new File() 构造
// 在 mergeAssets 之前生成 build-time.js 到 assets 目录
task generateBuildTimeFile {
    def projectDirPath = projectDir.absolutePath
    doFirst {
        def buildTime = new Date().format('yyyy-MM-dd HH:mm', TimeZone.getTimeZone('Asia/Shanghai'))
        def assetsDir = new File(projectDirPath, "src/main/assets/public")
        if (!assetsDir.exists()) assetsDir.mkdirs()
        def buildTimeFile = new File(assetsDir, "build-time.js")
        buildTimeFile.text = "window.BUILD_TIME = '${buildTime}';"
        logger.lifecycle("[build-time] 生成打包时间: ${buildTime}")
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn generateBuildTimeFile
    }
}

// 构建时间戳（北京时间），用于 versionName 标识每次打包版本
def BUILD_TIME = new Date().format('yyyyMMdd-HHmm', TimeZone.getTimeZone('Asia/Shanghai'))

android {
    namespace = "com.benneng.pres"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            storeFile file(signingProperties['storeFile'])
            // P1-13: 签名密码优先从环境变量读取，signing.properties 作为本地 fallback
            // 环境变量：TCM_STORE_PASSWORD / TCM_KEY_PASSWORD
            storePassword System.getenv('TCM_STORE_PASSWORD') ?: signingProperties['storePassword']
            keyAlias signingProperties['keyAlias']
            keyPassword System.getenv('TCM_KEY_PASSWORD') ?: signingProperties['keyPassword']
            // P1-9: 显式启用 APK v1/v2 签名方案（AGP 当前版本 API）
            // 注：v3/v4 签名方案在当前 AGP 版本不支持，使用默认 null 即可
            enableV1Signing true
            enableV2Signing true
        }
    }
    defaultConfig {
        applicationId "com.huikang.tcm.personal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 163
        versionName "1.0.${BUILD_TIME}"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.map'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs true
            multiDexEnabled false
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude '**/*.js.map'
        exclude '**/*.css.map'
    }
    lint {
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
}
