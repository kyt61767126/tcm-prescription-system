apply plugin: 'com.android.application'

// Fix javac Chinese output garbled text: force UTF-8 for source parsing and compile messages
// P1-编码修复: JDK17 的 stdout/stderr 不受 file.encoding 控制，需显式指定 + 英文 locale
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.forkOptions.jvmArgs += ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8', '-Duser.language=en', '-Duser.country=US']
}

def signingProperties = new Properties()
def signingPropertiesFile = file('signing.properties')
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

// 构建时间戳（北京时间），用于 versionName 标识每次打包版本
// 注意：使用脚本级变量而非方法定义，避免 task doFirst 闭包 delegate 解析失败
def BUILD_TIME = new Date().format('yyyyMMdd-HHmm', TimeZone.getTimeZone('Asia/Shanghai'))

android {
    namespace = "com.tcm.prescription"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            storeFile file(signingProperties['storeFile'])
            // P1-13: 签名密码优先从环境变量读取，signing.properties 作为本地 fallback
            // 环境变量：TCM_STORE_PASSWORD / TCM_KEY_PASSWORD
            // 这样 CI/CD 或团队构建可在不提交明文密码的前提下完成签名
            storePassword System.getenv('TCM_STORE_PASSWORD') ?: signingProperties['storePassword']
            keyAlias signingProperties['keyAlias']
            keyPassword System.getenv('TCM_KEY_PASSWORD') ?: signingProperties['keyPassword']
            // P1-9: 显式启用 APK v1/v2 签名方案（AGP 当前版本 API）
            // v1: JAR 签名（兼容 Android 7.0 以下）
            // v2: APK Signature Scheme v2（Android 7.0+，防篡改更强）
            // 注：v3/v4 签名方案在当前 AGP 版本不支持，使用默认 null 即可
            enableV1Signing true
            enableV2Signing true
        }
    }
    defaultConfig {
        applicationId "com.tcm.prescription"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 93
        versionName "1.0.${BUILD_TIME}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.map'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs true
            // 启用 multiDex 预防方法数超 65535 限制（Capacitor + 安全库 + AndroidX 可能超限）
            multiDexEnabled true
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude '**/*.js.map'
        exclude '**/*.css.map'
    }
    lint {
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 强制覆盖 capacitor.build.gradle 中的 Java 21 设置为 Java 17
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}