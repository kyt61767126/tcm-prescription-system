<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>惠康中医诊所管理系统 V1.0.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; padding: 20px; background: #fff; user-select: none; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .message { font-size: 14px; color: #333; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; flex: 1; overflow-y: auto; user-select: text; }
        .input { width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; outline: none; user-select: text; flex-shrink: 0; }
        .input:focus { border-color: #409eff; }
        .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-shrink: 0; }
        .btn { padding: 6px 16px; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; min-width: 60px; }
        .btn-primary { background: #409eff; color: #fff; }
        .btn-primary:hover { background: #66b1ff; }
        .btn-cancel { background: #f4f4f5; color: #606266; border: 1px solid #dcdfe6; }
        .btn-cancel:hover { background: #e9e9eb; }
    </style>
</head>
<body>
    <div class="message" id="message"></div>
    <input type="text" class="input" id="input" autocomplete="off" spellcheck="false">
    <div class="buttons">
        <button class="btn btn-cancel" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="okBtn">确定</button>
    </div>
    <script>
        // Parse params from hash (avoid file:// query string issues)
        try {
            const params = JSON.parse(decodeURIComponent(window.location.hash.slice(1)));
            document.getElementById('message').textContent = params.message || '';
            document.getElementById('input').value = params.defaultValue || '';
        } catch(e) {
            document.getElementById('message').textContent = '请输入：';
        }

        const input = document.getElementById('input');
        // Focus and select after a short delay to ensure rendering
        setTimeout(function() { input.focus(); input.select(); }, 50);

        function doSubmit() {
            if (window.promptAPI && typeof window.promptAPI.submit === 'function') {
                window.promptAPI.submit(input.value);
            }
        }
        function doCancel() {
            if (window.promptAPI && typeof window.promptAPI.cancel === 'function') {
                window.promptAPI.cancel();
            }
        }

        document.getElementById('okBtn').addEventListener('click', doSubmit);
        document.getElementById('cancelBtn').addEventListener('click', doCancel);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doSubmit(); }
            else if (e.key === 'Escape') { e.preventDefault(); doCancel(); }
        });
    </script>
</body>
</html>
