<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惠康中医诊所管理系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #fff;
            margin: 0;
        }
        /* ★ 2026-08-26 美观实用版：height:100% 填满零红框，输入框行高舒适，间距对称 */
        .login-container {
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .bg-decoration { display: none; }
        .header-section {
            position: relative;
            z-index: 1;
            padding: 6px 16px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-shrink: 0;
        }
        .system-title {
            font-size: 12px;
            font-weight: bold;
            color: white;
            letter-spacing: 0.5px;
        }
        .version-tag {
            font-size: 8px;
            font-weight: bold;
            color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.2);
            padding: 1px 6px;
            border-radius: 4px;
        }
        .main-content {
            position: relative;
            z-index: 1;
            padding: 3px 6px 1px;
            flex: 0 1 auto;  /* ★ 2026-08-28 彻底消除下红框空白：不占剩余高度，随内容收缩 */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            gap: 0;
        }
        .login-box {
            background: white;
            border-radius: 6px;
            padding: 6px 10px 4px;
            flex: 0 1 auto;
            border: 1px solid #f0f0f0;
            margin: 0;
        }
        /* ★ 2026-08-28 全局统一：诊所名卡片与云端网页版基准同款设计语言（accent浅底+accent色文字+细边框） */
        .clinic-info {
            text-align: center;
            padding: 6px;
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.15);
            border-radius: 4px;
            margin-bottom: 6px;
            cursor: pointer;
            position: relative;
        }
        .clinic-info .setup-hint {
            font-size: 9px;
            color: #e67e22;
            margin-top: 1px;
        }
        .clinic-info .setup-hint:hover { text-decoration: underline; }
        .clinic-name {
            font-size: 10px;
            font-weight: bold;
            color: #667eea;
            word-break: break-all;
        }
        .trial-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 10px;
        }
        .trial-bar.trial { background: #fff8e1; color: #856404; }
        .trial-bar.active { background: #d4edda; color: #155724; }
        .trial-bar.expired { background: #f8d7da; color: #721c24; }
        .trial-bar .trial-text { display: flex; align-items: center; gap: 3px; }
        .trial-bar .trial-action {
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }
        .trial-bar .trial-action:hover { text-decoration: underline; }
        .login-field {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .login-field label {
            font-size: 10px;
            font-weight: bold;
            color: #555;
        }
        .login-field select, .login-field input {
            width: 100%;
            padding: 6px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.4;
            background: #fafafa;
        }
        .login-field select:focus, .login-field input:focus {
            border-color: #667eea;
            outline: none;
            background: white;
        }
        .login-buttons {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }
        .login-btn {
            flex: 1;
            padding: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(102, 126, 234, 0.3);
        }
        .login-btn:hover { opacity: 0.92; }
        .login-btn:active { opacity: 0.85; }
        .login-btn.cancel {
            background: linear-gradient(135deg, #e0e0e0 0%, #bdbdbd 100%);
            color: #555;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .login-btn.cancel:hover { opacity: 0.92; }
        .login-error {
            color: #dc2626;
            font-size: 9px;
            text-align: center;
            margin-top: 5px;
            padding: 4px;
            background: #fff5f5;
            border-radius: 4px;
            border: 1px solid #fcc;
            display: none;
        }
        .footer-section {
            position: relative;
            z-index: 1;
            padding: 3px 10px 1px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 8px;
            color: #999;
            flex-shrink: 0;
        }
        /* ★ 2026-08-28 全局统一：多账户下拉切换（与网页/APP端同款设计，按桌面小窗等比缩放） */
        .username-input-wrapper { position: relative; flex: 1; }
        .username-input-wrapper input { width: 100%; padding-right: 28px; box-sizing: border-box; }
        .username-dropdown-btn { position: absolute; right: 0; top: 0; bottom: 0; width: 24px; padding: 0; border: 2px solid #e0e0e0; border-left: none; border-radius: 0 4px 4px 0; background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%); color: #666; font-size: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; z-index: 10; }
        .username-dropdown-btn:hover { background: linear-gradient(135deg, #e8e8e8 0%, #d0d0d0 100%); }
        .username-dropdown-menu { position: absolute; z-index: 100; display: none; background: white; border: 2px solid #667eea; border-radius: 4px; top: calc(100% + 3px); left: 0; right: 0; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12); max-height: 120px; overflow-y: auto; }
        .username-dropdown-menu.show { display: block; }
        .username-dropdown-menu div { padding: 6px 8px; font-size: 10px; color: #333; cursor: pointer; }
        .username-dropdown-menu div:hover { background: #667eea; color: white; }
        .password-input-wrapper { position: relative; flex: 1; }
        .password-input-wrapper input { width: 100%; padding-right: 34px; box-sizing: border-box; }
        .password-toggle-btn { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #999; font-size: 13px; border-radius: 4px; user-select: none; -webkit-tap-highlight-color: transparent; }
        .password-toggle-btn:hover { background: #f0f0f0; color: #667eea; }
        .password-toggle-btn.visible { color: #667eea; background: rgba(102,126,234,0.1); }
        .login-security { display: flex; align-items: center; justify-content: center; gap: 3px; margin-top: 3px; font-size: 9px; color: #aaa; }
        .login-security-icon { color: #22c55e; }
        .copyright { text-align: center; margin-top: 1px; font-size: 9px; color: #bbb; line-height: 1.1; padding: 0 0 3px; }
        .copyright-version { text-align: center; font-size: 10px; color: #ccc; margin-top: 4px; }
        /* 首次配置向导 */
        .wizard-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .wizard-overlay.show { display: flex; }
        .wizard-box {
            width: 280px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .wizard-box h2 {
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 4px;
            text-align: center;
        }
        .wizard-box .wizard-sub {
            font-size: 10px;
            color: #888;
            text-align: center;
            margin-bottom: 14px;
        }
        .wizard-step { display: none; }
        .wizard-step.active { display: block; }
        .wizard-step label {
            display: block;
            font-size: 10px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }
        .wizard-step input {
            width: 100%;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 11px;
            margin-bottom: 10px;
        }
        .wizard-step input:focus {
            border-color: #667eea;
            outline: none;
        }
        .wizard-nav {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
        }
        .wizard-nav button {
            padding: 7px 16px;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .wizard-nav .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .wizard-nav .btn-prev {
            background: #f0f0f0;
            color: #666;
        }
        .wizard-nav .btn-skip {
            background: transparent;
            color: #888;
            text-decoration: underline;
        }
        .wizard-progress {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 14px;
        }
        .wizard-progress .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
        }
        .wizard-progress .dot.active {
            background: #667eea;
        }
        .wizard-progress .dot.done {
            background: #27ae60;
        }
        .password-strength {
            font-size: 9px;
            margin-top: -6px;
            margin-bottom: 8px;
            padding: 4px 6px;
            border-radius: 3px;
            display: none;
        }
        .password-strength.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="bg-decoration"></div>
        <div class="header-section">
            <span class="system-title">惠康中医诊所管理系统</span>
            <!-- ★ 2026-08-28 全局统一（与云端网页/APP端 2026-08-23 定版一致）：登录框不显示版本标签，版本在登录成功后主界面顶栏显示。元素保留（applyEditionTag 逻辑不破坏），仅视觉隐藏 -->
            <span class="version-tag" id="loginVersionTag" style="display:none;">【离线标准版 · 登录后显示版本】</span>
        </div>
        <div class="main-content">
            <div class="login-box">
                <div class="clinic-info" onclick="openFirstRunWizard()" title="点击设置诊所信息">
                    <div id="clinicName" class="clinic-name">本能堂中医诊所</div>
                    <div id="clinicSetupHint" class="setup-hint" style="display:none;">⚙️ 点击设置诊所信息</div>
                </div>
                <div class="login-field">
                    <label>手机号/用户名</label>
                    <!-- ★ 2026-08-28 全局统一：桌面版登录框增加多账户下拉切换（与网页/APP端 usernameDropdownBtn 同款）
                         初始显示：display:inline-flex（不再依赖渲染函数），函数内再按实际项调整文本 -->
                    <div class="username-input-wrapper">
                        <input type="text" id="loginUsername" placeholder="请输入手机号或用户名" autocomplete="off">
                        <button type="button" id="usernameDropdownBtn" class="username-dropdown-btn" onclick="toggleUsernameDropdown()" title="切换已注册用户">▼</button>
                        <div id="usernameDropdownMenu" class="username-dropdown-menu"></div>
                    </div>
                    <div id="loginDoctorName" style="font-size:9px;color:#667eea;display:none;"></div>
                </div>
                <div class="login-field">
                    <label>密码</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" placeholder="请输入密码">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="显示/隐藏密码">👁️</button>
                    </div>
                </div>
                <div class="login-buttons">
                    <button class="login-btn" id="btnOk" type="button">确定</button>
                    <button class="login-btn cancel" id="btnCancel" type="button">取消</button>
                </div>
                <div id="loginError" class="login-error"></div>
                <div class="login-security"><span class="login-security-icon">🛡️</span><span>安全登录 · 数据加密保护</span></div>
                <!-- ★ 激活入口（2026-08-19 收敛）：登录框仅对未激活/试用到期用户显示极简提示，正式激活后洁净；激活入口已移至操作界面-基础设置底部 -->
                <div id="activateHintWrap" style="display:none;text-align:center;margin-top:8px;">
                    <a href="#" id="activateLink" onclick="openActivationWindow();return false;" style="font-size:9px;color:#e67e22;text-decoration:none;">⚠️ 尚未激活 / 试用已到期，点此激活</a>
                </div>
            </div>
        </div>
        <div class="footer-section">
            <span>微信号: hktzy1688</span>
        </div>
        <div class="copyright">© 2026 惠康中医 · 保留所有权利</div>
    </div>

    <!-- 首次配置向导 -->
    <div id="wizardOverlay" class="wizard-overlay">
        <div class="wizard-box">
            <h2>🏥 首次使用设置</h2>
            <div class="wizard-sub">完善诊所信息，开启您的中医处方管理之旅</div>
            <div class="wizard-progress" id="wizardProgress"></div>

            <!-- 步骤1：诊所名称 -->
            <div class="wizard-step active" data-step="1">
                <label>诊所名称 *</label>
                <input type="text" id="wizardClinicName" placeholder="如：惠康中医诊所" maxlength="50">
            </div>

            <!-- 步骤2：注册管理员账户 -->
            <div class="wizard-step" data-step="2">
                <label>设置管理员用户名 *</label>
                <div style="font-size:11px;color:#3b82f6;background:#eff6ff;border:1px solid #bfdbfe;padding:4px 8px;border-radius:4px;margin-bottom:6px;">
                    ℹ️ 此为系统登录用户名（<b>≠真实姓名</b>），建议使用英文或拼音，真实姓名请在下一步填写
                </div>
                <input type="text" id="wizardUsername" placeholder="4-20位，以字母开头，如：admin / wangguijie" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <div id="wizardUsernameHint" style="font-size:11px;color:#ef4444;margin-top:4px;display:none;"></div>
                <label>设置管理员密码 *</label>
                <input type="password" id="wizardPassword" placeholder="至少8位，含字母和数字" oninput="checkWizardPassword()">
                <div id="wizardPwdStrength" class="password-strength"></div>
                <label>确认密码 *</label>
                <input type="password" id="wizardPassword2" placeholder="再次输入密码">
            </div>

            <!-- 步骤3：医师信息 -->
            <div class="wizard-step" data-step="3">
                <label>管理员/医师真实姓名</label>
                <div style="font-size:11px;color:#6b7280;margin-bottom:4px;">💡 此处填写您的真实姓名（可中文），将显示在处方签名处</div>
                <input type="text" id="wizardDoctorName" placeholder="如：张医生 / 王桂杰">
                <label>医师职称（可选）</label>
                <input type="text" id="wizardTitle" placeholder="如：主治医师 / 主任医师">
                <div style="font-size:9px;color:#888;margin-top:6px;">💡 以上信息可在登录后"基础设置"中随时修改</div>
            </div>

            <div class="wizard-nav">
                <button class="btn-prev" onclick="wizardPrev()" id="wizardPrevBtn" style="display:none;">上一步</button>
                <button class="btn-skip" onclick="wizardSkip()" id="wizardSkipBtn">跳过</button>
                <button class="btn-next" onclick="wizardNext()" id="wizardNextBtn">下一步</button>
            </div>
        </div>
    </div>

    <script src="auth-core.js"></script>
    <script src="permission.js"></script>
    <script src="user-store.js"></script>
    <script src="login.js"></script>
</body>
</html>
