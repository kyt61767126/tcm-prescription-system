# Project-wide Gradle settings.

# JVM 内存调优：增大堆内存，使用 G1GC 替代 SerialGC（构建性能提升）
# 旧值 -Xmx1536m -XX:+UseSerialGC 在打包 Capacitor+SQLCipher 时易 OOM
# P1-编码修复: JDK17 的 stdout/stderr 不受 file.encoding 控制，需显式指定
# 同时强制英文 locale，避免 javac/D8/R8 输出中文警告导致 chcp 65001 下乱码
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Duser.language=en -Duser.country=US -XX:+UseG1GC

# 构建缓存与并行编译（提升增量构建速度）
org.gradle.caching=true
org.gradle.parallel=true
# Enable daemon (keeps JVM warm between builds - 2-3x faster)
org.gradle.daemon=true
# Enable configuration cache (Gradle 8+)
org.gradle.configuration-cache=true
# Configure on-demand (only configure relevant projects)
org.gradle.configureondemand=true
# Increase worker count
org.gradle.workers.max=4

# AndroidX
android.useAndroidX=true
android.overridePathCheck=true

# R8 full mode：比 compat mode 多减少 5-10% APK 体积
# full mode 更激进地移除未使用代码，需配合精确的 proguard 规则
android.enableR8.fullMode=true

# JDK 17
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.19.10-hotspot
java.toolchain.languageVersion=17
