buildscript {
    
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        google()
        mavenCentral()
    }
}

subprojects {
    // Force Java 17 for all subprojects (Capacitor 8.x defaults to VERSION_21)
    // Uses afterEvaluate to override after each module's own build.gradle is processed
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('com.android.application')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.withType(JavaCompile) {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
        // Fix: AGP 8.13.0 + Gradle 8.14.3 annotationProcessor input validation
        // Ensure javaPreCompileRelease runs before compileReleaseJavaWithJavac
        // to generate annotationProcessors.json (capacitor-community-sqlite uses Room annotationProcessor)
        def compileTask = project.tasks.findByName('compileReleaseJavaWithJavac')
        def preTask = project.tasks.findByName('javaPreCompileRelease')
        if (compileTask != null && preTask != null) {
            compileTask.dependsOn preTask
        }
    }
    // Also set during configuration phase as backup
    tasks.withType(JavaCompile) {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile) {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

task clean(type: Delete) {
    delete rootProject.buildDir
}