<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>软件激活</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #333;
    padding: 24px 16px;
    font-size: 14px;
    user-select: none;
    min-height: 100vh;
}
.container {
    max-width: 440px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}
.brand {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f0f0f0;
}
.brand .logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 10px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}
h1 {
    color: #2c3e50;
    font-size: 20px;
    text-align: center;
    margin-bottom: 6px;
}
.subtitle {
    color: #909399;
    font-size: 12px;
    text-align: center;
}
.form-group { margin-bottom: 14px; }
.form-group label {
    display: block;
    margin-bottom: 6px;
    color: #606266;
    font-weight: 500;
    font-size: 13px;
}
.form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #dcdfe6;
    border-radius: 6px;
    font-size: 14px;
    font-family: "Courier New", monospace;
    letter-spacing: 1px;
    transition: border-color 0.2s, box-shadow 0.2s;
    user-select: text;
    background: #fafbfc;
}
.form-group input:focus {
    border-color: #667eea;
    outline: none;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    background: #fff;
}
.form-group input::placeholder {
    color: #c0c4cc;
    letter-spacing: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
.btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
    margin-top: 10px;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}
.btn:hover { opacity: 0.92; box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4); }
.btn:active { transform: translateY(1px); }
.btn:disabled {
    background: #bdc3c7;
    cursor: not-allowed;
    box-shadow: none;
    opacity: 0.7;
}
.btn-secondary {
    background: #fff;
    color: #606266;
    border: 1.5px solid #dcdfe6;
    box-shadow: none;
    margin-top: 8px;
}
.btn-secondary:hover { background: #f5f7fa; border-color: #c0c4cc; }

.status-box {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
    line-height: 1.5;
}
.status-box.show { display: block; }
.status-box.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}
.status-box.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
.status-box.loading {
    background: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
    display: flex;
    align-items: center;
    gap: 8px;
}
.spinner {
    width: 14px;
    height: 14px;
    border: 2px solid #bee5eb;
    border-top-color: #0c5460;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.machine-id-box {
    margin-top: 16px;
    padding: 10px 12px;
    background: #f5f7fa;
    border: 1px solid #e4e7ed;
    border-radius: 6px;
    font-size: 11px;
    color: #606266;
    font-family: "Courier New", monospace;
    word-break: break-all;
    user-select: text;
    position: relative;
}
.machine-id-box .label {
    color: #606266;
    font-weight: 500;
    margin-bottom: 4px;
    font-family: inherit;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.machine-id-box .label-text {
    display: flex;
    align-items: center;
    gap: 4px;
}
.machine-id-box .copy-btn {
    background: #667eea;
    color: #fff;
    border: none;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    transition: background 0.2s;
}
.machine-id-box .copy-btn:hover { background: #5a6fd6; }
.machine-id-box .copy-btn.copied { background: #67c23a; }
.machine-id-box .id-value {
    color: #909399;
    font-size: 12px;
    padding: 4px 0;
    letter-spacing: 0.5px;
}

.contact-box {
    margin-top: 14px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #fff8e1 0%, #fff3cd 100%);
    border: 1px solid #ffe082;
    border-radius: 6px;
    font-size: 12px;
    color: #856404;
    line-height: 1.7;
}
.contact-box .title {
    color: #9c640c;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
}
.contact-box .item {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 3px 0;
}
.contact-box .item strong {
    color: #9c640c;
    min-width: 50px;
}
.contact-box .copy-inline {
    background: #9c640c;
    color: #fff;
    border: none;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    margin-left: 4px;
}
.contact-box .copy-inline:hover { background: #7e5310; }
.contact-box .copy-inline.copied { background: #67c23a; }

.info-box {
    margin-top: 14px;
    padding: 10px 12px;
    background: #f4f4f5;
    border: 1px solid #e4e7ed;
    border-radius: 6px;
    font-size: 11px;
    color: #606266;
    line-height: 1.7;
}
.info-box strong { color: #303133; }
.info-box ol { padding-left: 18px; margin-top: 4px; }
.info-box ol li { margin: 2px 0; }

.retry-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 14px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
}
.retry-btn:hover { background: #5a6fd6; }
</style>
</head>
<body>
<div class="container">
    <div class="brand">
        <div class="logo">惠</div>
        <h1>软件激活</h1>
        <div class="subtitle">请输入激活码以继续使用</div>
    </div>

    <div id="statusBox" class="status-box"></div>

    <div class="form-group">
        <label>激活码</label>
        <input type="text" id="activationCode" placeholder="BNZC-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    </div>

    <div class="form-group">
        <label>诊所名称（与激活码绑定的诊所一致）</label>
        <input type="text" id="clinicName" placeholder="如：本能堂中医诊所" autocomplete="off">
    </div>

    <div class="form-group">
        <label>用户名（可选）</label>
        <input type="text" id="userName" placeholder="留空则使用激活码绑定的用户名" autocomplete="off">
    </div>

    <button class="btn" id="activateBtn" onclick="submitActivate()">激 活</button>
    <button class="btn btn-secondary" onclick="closeWindow()">取 消</button>

    <div class="machine-id-box">
        <div class="label">
            <span class="label-text">🔑 本机机器 ID（联系客服时提供）</span>
            <button class="copy-btn" id="copyMachineIdBtn" onclick="copyMachineId()">复制</button>
        </div>
        <div class="id-value" id="machineId">加载中...</div>
    </div>

    <div class="contact-box">
        <div class="title">📞 获取激活码</div>
        <div class="item"><strong>微信：</strong><span>huikang-tcm</span><button class="copy-inline" onclick="copyText(this, 'huikang-tcm')">复制</button></div>
        <div class="item"><strong>电话：</strong><span>400-xxx-xxxx</span><button class="copy-inline" onclick="copyText(this, '400-xxx-xxxx')">复制</button></div>
        <div class="item" style="margin-top: 6px; color: #9c640c; font-size: 11px;">向客服提供上方机器 ID 和诊所名称，即可获取激活码</div>
    </div>

    <div class="info-box">
        <strong>激活说明：</strong>
        <ol>
            <li>激活码格式：BNZC-XXXX-XXXX-XXXX-XXXX</li>
            <li>每个激活码绑定一台设备 + 一个诊所</li>
            <li>换机或换诊所需联系客服解绑</li>
            <li>激活成功后软件将自动重启</li>
            <li>如无法联网，请联系客服获取离线激活文件</li>
        </ol>
    </div>
</div>

<script>
// 从 URL 参数获取机器 ID
const params = new URLSearchParams(window.location.search);
document.getElementById('machineId').textContent = params.get('machineId') || '未知';

// ★ v3 新增：自动从 config.json 预填诊所名（用户可改）
(async function prefillClinicName() {
    try {
        if (window.electronAPI && window.electronAPI.getAppConfig) {
            const result = await window.electronAPI.getAppConfig();
            if (result && result.success && result.config && result.config.clinicName) {
                document.getElementById('clinicName').value = result.config.clinicName;
            }
        }
    } catch (e) { /* 预填失败不影响激活流程 */ }
})();

// 自动格式化激活码输入
document.getElementById('activationCode').addEventListener('input', function(e) {
    let val = e.target.value.toUpperCase().replace(/[^A-HJ-NP-Z2-9-]/g, '');
    // 自动添加连字符
    const clean = val.replace(/-/g, '');
    if (clean.length > 4) {
        const groups = [];
        for (let i = 0; i < clean.length && i < 20; i += 4) {
            groups.push(clean.substring(i, i + 4));
        }
        val = groups.join('-');
    }
    e.target.value = val;
});

// 回车键激活
document.getElementById('activationCode').addEventListener('keyup', e => {
    if (e.key === 'Enter') document.getElementById('clinicName').focus();
});
document.getElementById('clinicName').addEventListener('keyup', e => {
    if (e.key === 'Enter') document.getElementById('userName').focus();
});
document.getElementById('userName').addEventListener('keyup', e => {
    if (e.key === 'Enter') submitActivate();
});

function showStatus(message, type, withRetry) {
    const box = document.getElementById('statusBox');
    box.className = 'status-box show ' + type;
    if (type === 'loading') {
        box.innerHTML = '<span class="spinner"></span><span>' + message + '</span>';
    } else if (withRetry) {
        box.innerHTML = message + ' <button class="retry-btn" onclick="resetActivateBtn()">重试</button>';
    } else {
        box.textContent = message;
    }
}

function resetActivateBtn() {
    const btn = document.getElementById('activateBtn');
    btn.disabled = false;
    btn.textContent = '激 活';
}

// 复制机器 ID
function copyMachineId() {
    const text = document.getElementById('machineId').textContent;
    copyText(document.getElementById('copyMachineIdBtn'), text);
}

// 通用复制函数
function copyText(btn, text) {
    const fallback = () => {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            return true;
        } catch (e) { return false; }
    };
    const markCopied = () => {
        const orig = btn.textContent;
        btn.classList.add('copied');
        btn.textContent = '已复制';
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.textContent = orig;
        }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(() => {
            if (fallback()) markCopied();
        });
    } else {
        if (fallback()) markCopied();
    }
}

async function submitActivate() {
    const code = document.getElementById('activationCode').value.trim();
    const clinicName = document.getElementById('clinicName').value.trim();
    const user = document.getElementById('userName').value.trim();

    if (!code) {
        showStatus('请输入激活码', 'error');
        return;
    }

    // 校验格式
    const pattern = /^BNZC-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/;
    if (!pattern.test(code)) {
        showStatus('激活码格式错误，应为 BNZC-XXXX-XXXX-XXXX-XXXX', 'error');
        return;
    }

    // ★ v3 新增：诊所名格式校验（如填写）
    if (clinicName && clinicName.includes('|')) {
        showStatus('诊所名不能包含特殊字符 |', 'error');
        return;
    }
    if (clinicName && clinicName.length > 100) {
        showStatus('诊所名长度不能超过 100 字符', 'error');
        return;
    }

    const btn = document.getElementById('activateBtn');
    btn.disabled = true;
    btn.textContent = '激活中...';
    showStatus('正在连接服务器验证激活码...', 'loading');

    try {
        // ★ v3 新增：提交 clinicName 给云端校验绑定
        const result = await window.electronAPI.activate.submit(code, user, clinicName);
        if (result.success) {
            showStatus('激活成功！软件将自动重启...', 'success');
            btn.textContent = '激活成功';
            // 给用户一点时间看到成功提示
            setTimeout(() => {
                window.electronAPI.activate.restart();
            }, 1500);
        } else {
            const err = result.error || '激活失败';
            // 权限错误/网络错误显示重试按钮
            const withRetry = /权限|网络|超时|连接/.test(err);
            showStatus(err, 'error', withRetry);
            btn.disabled = false;
            btn.textContent = '激 活';
        }
    } catch (e) {
        showStatus('激活过程出错：' + e.message, 'error', true);
        btn.disabled = false;
        btn.textContent = '激 活';
    }
}

function closeWindow() {
    window.electronAPI.activate.close();
}
</script>
</body>
</html>
