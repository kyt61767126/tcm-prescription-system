<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本能中医处方系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(180deg, #e0f4ff 0%, #c8e1f5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            width: 247px;
            height: 320px;
            background: linear-gradient(180deg, #e0f4ff 0%, #c8e1f5 100%);
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.3);
            overflow: hidden;
            position: relative;
            border: 2px solid #4a90d9;
        }
        
        .bg-decoration {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 300"><defs><pattern id="circles" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.5" fill="rgba(74, 144, 217, 0.12)"/></pattern></defs><rect fill="url(%23circles)" width="247" height="300"/></svg>');
            background-size: cover;
            pointer-events: none;
            z-index: 0;
        }
        
        .header-section {
            position: relative;
            z-index: 1;
            padding: 13px 17px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: linear-gradient(180deg, #4a90d9 0%, #357abd 100%);
            border-bottom: 1.5px solid #2962a3;
        }
        
        .system-title {
            font-size: 15px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            letter-spacing: 1.5px;
        }
        
        .version-tag {
            font-size: 10px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }
        
        .main-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: calc(100% - 52px);
            padding: 2px 13px 0;
        }
        
        .login-box {
            background: rgba(255,255,255,0.95);
            border-radius: 7px;
            padding: 12px 18px 15px;
            width: 100%;
            max-width: 165px;
            box-shadow: 0 3px 10px rgba(74, 144, 217, 0.3);
            border: 1.5px solid #7ab8f5;
        }

        .clinic-info {
            text-align: center;
            padding: 8px 10px;
            background: linear-gradient(180deg, #fff5f5 0%, #ffeaea 100%);
            border: 1px solid #ffcccc;
            border-radius: 4px;
            margin-bottom: 13px;
        }

        .clinic-name {
            font-size: 11px;
            font-weight: bold;
            color: #8b0000;
        }
        
        .login-field {
            margin-bottom: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .login-field label {
            width: 33px;
            font-size: 10px;
            font-weight: bold;
            color: #333;
            text-align: left;
            white-space: nowrap;
            line-height: 1.2;
        }
        
        .login-field select {
            flex: 1;
            padding: 4px 5px;
            border: 1.5px solid #4a90d9;
            border-radius: 4px;
            font-size: 9px;
            background: white;
            min-width: 64px;
            max-width: 68px;
        }
        
        .login-field input {
            flex: 1;
            padding: 4px 5px;
            border: 1.5px solid #4a90d9;
            border-radius: 4px;
            font-size: 9px;
            background: white;
            min-width: 64px;
            max-width: 68px;
        }
        
        .login-field select:focus, .login-field input:focus {
            border-color: #2962a3;
            outline: none;
            box-shadow: 0 0 5px rgba(74, 144, 217, 0.5);
        }
        .username-input-wrapper { position: relative; flex: 1; min-width: 64px; max-width: 90px; }
        .username-input-wrapper input { width: 100%; padding: 4px 26px 4px 5px; border: 1.5px solid #808080; border-radius: 2px; font-size: 9px; background: white; }
        .username-input-wrapper input:focus { border-color: #4a90d9; outline: none; }
        .username-dropdown-btn { position: absolute; right: 0; top: 0; bottom: 0; width: 24px; padding: 0; border: 1.5px solid #808080; border-left: none; border-radius: 0 2px 2px 0; background: linear-gradient(180deg, #f0f0f0 0%, #d8d8d8 100%); color: #666; font-size: 7px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .username-dropdown-btn:hover { background: linear-gradient(180deg, #e0e0e0 0%, #c8c8c8 100%); }
        .username-dropdown-menu { position: absolute; z-index: 100; display: none; background: white; border: 1.5px solid #808080; border-radius: 2px; top: calc(100% + 1px); left: 0; right: 0; box-shadow: 2px 2px 6px rgba(0,0,0,0.2); max-height: 100px; overflow-y: auto; }
        .username-dropdown-menu.show { display: block; }
        .username-dropdown-menu div { padding: 4px 6px; font-size: 9px; color: #333; cursor: pointer; }
        .username-dropdown-menu div:hover { background: #3366cc; color: white; }
        
        .login-buttons {
            display: flex;
            gap: 13px;
            justify-content: center;
            margin-top: 17px;
        }
        
        .login-btn {
            padding: 5px 15px;
            min-width: 53px;
            background: linear-gradient(180deg, #6cb3f0 0%, #4a90d9 100%);
            color: #fff;
            border: 1.5px solid #357abd;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 1.5px 2px 4px rgba(0, 82, 152, 0.35);
            transition: all 0.2s;
        }
        
        .login-btn:hover {
            background: linear-gradient(180deg, #8dc8f7 0%, #6cb3f0 100%);
            transform: translateY(-0.5px);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 8px;
            color: #666;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 4px;
            margin-top: 5px;
            margin-left: 41px;
        }
        
        .remember-me input[type="checkbox"] {
            width: 12px;
            height: 12px;
            accent-color: #4a90d9;
            cursor: pointer;
        }
        
        .remember-me label {
            font-size: 8px;
            color: #666;
            cursor: pointer;
        }
        
        .login-error {
            color: #dc2626;
            font-size: 7px;
            text-align: center;
            margin-top: 7px;
            padding: 4px;
            background: #fff5f5;
            border-radius: 2px;
            border: 1px solid #fcc;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="bg-decoration"></div>
        
        <div class="header-section">
            <span class="system-title">本能中医处方系统</span>
            <span class="version-tag">【云版】</span>
        </div>
        
        <div class="main-content">
            <div class="login-box">
                <div class="clinic-info">
                    <div id="clinicName" class="clinic-name">本能堂中医诊所</div>
                </div>
                <div class="login-field">
                    <label>用户：</label>
                    <div class="username-input-wrapper">
                        <input type="text" id="loginUsername" placeholder="请输入用户名">
                        <button id="usernameDropdownBtn" class="username-dropdown-btn" style="display:none;">▼</button>
                        <div id="usernameDropdownMenu" class="username-dropdown-menu"></div>
                    </div>
                </div>
                
                <div class="login-field">
                    <label>密码：</label>
                    <input type="password" id="loginPassword" placeholder="">
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="rememberUser">
                    <label for="rememberUser">记住用户</label>
                </div>
                
                <div class="login-buttons">
                    <button class="login-btn" id="loginBtn">确定</button>
                    <button class="login-btn" id="cancelBtn">取消</button>
                </div>
                
                <div id="loginError" class="login-error"></div>
                
                <div class="login-footer">微信号: yqjzy1688</div>
            </div>
        </div>
    </div>
    
    <script>
        // 云端 API 基址（与 index.html 中保持一致）
        const CLOUD_API_BASE = 'https://tcm-prescription-system.pages.dev/api';

        async function getConfigFromIndexHtml() {
            try {
                const result = await window.electronAPI.getIndexHtmlContent();
                if (!result || !result.success || !result.content) return {};
                const content = result.content;
                const config = {};
                const clinicNameMatch = content.match(/clinicName\s*:\s*['"]([^'"]+)['"]/);
                if (clinicNameMatch) config.clinicName = clinicNameMatch[1];
                return config;
            } catch (e) {
                console.log('读取index.html失败:', e.message);
                return {};
            }
        }

        async function loadClinicName() {
            // 优先读 global_clinicName（index.html saveSettings 写入），fallback clinicName
            const savedName = localStorage.getItem('global_clinicName') || localStorage.getItem('clinicName');
            const config = await getConfigFromIndexHtml();
            const clinicName = savedName || config.clinicName || '本能堂中医诊所';
            const clinicNameElement = document.getElementById('clinicName');
            if (clinicNameElement) clinicNameElement.textContent = clinicName;
        }

        // 恢复记住的用户名
        async function initLoginFields() {
            let usernames = [];
            try {
                const localList = localStorage.getItem('cloud_rememberedUsers');
                if (localList) {
                    const parsed = JSON.parse(localList);
                    if (Array.isArray(parsed)) {
                        usernames = parsed.map(u => String(u).trim()).filter(u => u);
                    } else if (typeof parsed === 'string') {
                        usernames = [parsed.trim()];
                    }
                }
            } catch (e) {}

            if (usernames.length === 0) {
                const single = localStorage.getItem('cloud_rememberedUsername') || localStorage.getItem('rememberedUsername');
                if (single) {
                    usernames = [single];
                    localStorage.setItem('cloud_rememberedUsers', JSON.stringify(usernames));
                }
            }

            if (usernames.length > 0) {
                renderRememberedUsers(usernames);
                document.getElementById('loginUsername').value = usernames[0];
                document.getElementById('rememberUser').checked = true;
            }
        }

        function renderRememberedUsers(usernames) {
            const btn = document.getElementById('usernameDropdownBtn');
            const menu = document.getElementById('usernameDropdownMenu');
            if (!btn || !menu) return;

            if (usernames.length === 0) {
                btn.style.display = 'none';
                menu.style.display = 'none';
                return;
            }

            btn.style.display = 'flex';
            btn.textContent = '▼(' + usernames.length + ')';
            menu.innerHTML = '';

            usernames.forEach(username => {
                const item = document.createElement('div');
                item.textContent = username;
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    document.getElementById('loginUsername').value = username;
                    document.getElementById('loginPassword').focus();
                    menu.classList.remove('show');
                });
                menu.appendChild(item);
            });

            btn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                menu.classList.toggle('show');
            };
        }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('usernameDropdownMenu');
            const btn = document.getElementById('usernameDropdownBtn');
            if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove('show');
            }
        });

        function saveRememberedUser(username) {
            const cleanUsername = String(username).trim();
            if (!cleanUsername) return;

            let remembered = [];
            try {
                const localList = localStorage.getItem('cloud_rememberedUsers');
                if (localList) {
                    const parsed = JSON.parse(localList);
                    if (Array.isArray(parsed)) {
                        remembered = parsed;
                    } else if (typeof parsed === 'string') {
                        remembered = [parsed];
                    }
                }
            } catch (e) {}

            remembered = remembered.filter(u => String(u).toLowerCase() !== cleanUsername.toLowerCase());
            remembered.unshift(cleanUsername);
            if (remembered.length > 5) remembered = remembered.slice(0, 5);

            localStorage.setItem('cloud_rememberedUsername', cleanUsername);
            localStorage.setItem('rememberedUsername', cleanUsername);
            localStorage.setItem('cloud_rememberedUsers', JSON.stringify(remembered));
        }

        // 调用后端登录端点：POST /api/users?login=true
        // 后端会在所有诊所 + 平台管理员中查找并校验密码（SHA-256 + salt）
        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (!username) {
                errorDiv.textContent = '请输入用户名';
                errorDiv.style.display = 'block';
                return;
            }
            if (!password) {
                errorDiv.textContent = '请输入密码';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.textContent = '正在登录...';
            errorDiv.style.display = 'block';
            errorDiv.style.color = '#666';

            try {
                const response = await fetch(`${CLOUD_API_BASE}/users?login=true`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (!data.success || !data.user) {
                    errorDiv.textContent = data.error || '用户名或密码错误';
                    errorDiv.style.display = 'block';
                    errorDiv.style.color = '#dc2626';
                    return;
                }
                const user = data.user;
                localStorage.setItem('cloud_currentUser', JSON.stringify(user));
                localStorage.setItem('cloud_isLoggedIn', 'true');
                localStorage.setItem('currentUser', JSON.stringify(user));
                localStorage.setItem('isLoggedIn', 'true');

                const rememberUser = document.getElementById('rememberUser').checked;
                if (rememberUser) {
                    saveRememberedUser(username);
                } else {
                    localStorage.removeItem('cloud_rememberedUsername');
                    localStorage.removeItem('rememberedUsername');
                }

                errorDiv.textContent = '登录成功，正在打开...';
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#4CAF50';

                if (!window.electronAPI) {
                    errorDiv.textContent = '错误：桌面环境未初始化，请重启应用';
                    errorDiv.style.color = '#dc2626';
                    return;
                }
                await window.electronAPI.loginSuccess(user);
            } catch (err) {
                console.error('Login error:', err);
                errorDiv.textContent = '登录失败：' + (err.message || '网络错误');
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#dc2626';
            }
        }

        function handleCancel() {
            if (window.electronAPI) {
                window.electronAPI.loginCancel();
            } else {
                window.close();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 优先绑定事件，确保输入框和按钮立即可用，不被异步 IPC 调用阻塞
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('cancelBtn').addEventListener('click', handleCancel);
            document.getElementById('loginPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
            document.getElementById('loginUsername').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginPassword').focus();
            });
            // 异步加载诊所名称和记住的登录信息（不阻塞界面交互）
            loadClinicName().catch(e => console.warn('loadClinicName失败:', e));
            initLoginFields().catch(e => console.warn('initLoginFields失败:', e));
        });
    </script>
</body>
</html>
