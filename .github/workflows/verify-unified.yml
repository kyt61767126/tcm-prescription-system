name: Verify Unified Modules

# ★ P2-6 校验闭环 (2026-08-29)：界面基础代码三重防线入 CI
#   ① check-interface.ps1   —— 界面 body DOM 结构 vs .interface-lock.json 基线
#   ② sync-all.ps1 -VerifyOnly —— shared/ JS 权威源 vs 各端副本一致性
#   ③ html-sync-check.ps1   —— 云端 index.html 权威源 vs 云桌面/云APP 副本
#                               + 桌面 login.html 双版漂移
#   任一失败即 fail，让副本漂移在推送时立刻可见（不再依赖人工记忆检查清单）。
# ★ 2026-08-31 升级为四重防线：
#   ④ check-injection-idempotency.cjs —— 注入脚本幂等性门（防"Build 203 Build 203..."
#     类重复拼接复发：壳注入串/注入型 JS 资产里的 textContent += / innerHTML +=
#     / 正则 replace 动态后缀追加，新增即 fail，基线 tools/.injection-baseline.json）。

# ★ 2026-08-31 升级为五重防线：
#   ⑤ test-source-settled.ps1 —— 源码落定门单测（防白名单漏项误拦用户打包 /
#     白名单开洞放进半成品代码回归；build.gradle versionCode / hash-manifest
#     误拦事故的回归守护）。
#     顺带守护其依赖链：pack-side-effects.ps1（副作用清单单一权威源）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 排除 sync-shared-modules 自动提交触发的循环（其自身已有同步职责）
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-interface.ps1 需要 git log 判断基线新鲜度；test-source-settled 需要 git diff

      - name: 1/5 Interface structure baseline check
        shell: pwsh
        run: |
          ./tools/check-interface.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::界面 DOM 结构与基线不一致。若为预期界面改动，请运行 generate-interface-lock.ps1 重建基线并连同页面一起提交；否则 git checkout 还原页面。"
            exit 1
          }

      - name: 2/5 shared modules sync verify
        shell: pwsh
        run: |
          ./tools/sync-all.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::shared/ 权威源与各端副本不一致。请先在本地修改 shared/ 权威源后运行 tools/sync-all.ps1 同步，再提交。"
            exit 1
          }

      - name: 3/5 HTML copies drift check
        shell: pwsh
        run: |
          ./tools/html-sync-check.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::云端 index.html 副本或桌面 login.html 双版发生漂移。修复方式：以权威源(public/index.html 或 cloud_desktop login.html)为准回改副本，或先改权威源再同步。"
            exit 1
          }

      - name: 4/5 Injection idempotency check
        shell: bash
        run: |
          node tools/check-injection-idempotency.cjs || {
            echo "::error::注入脚本存在未收录的非幂等 DOM 追加语句（Build 号重复拼接同类 bug）。请改为整段重写或补 indexOf 守卫；确属带守卫的合法兜底，审查后运行 --update-baseline 收录基线。"
            exit 1
          }

      - name: 5/5 Source-settled gate unit tests
        shell: pwsh
        run: |
          ./tools/test-source-settled.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::源码落定门单测失败：白名单可能漏项（新增打包副作用未登记 tools/pack-side-effects.ps1 → 用户打包被误拦）或开洞（放行了真实源码 → 半成品风险）。"
            exit 1
          }

      - name: Summary
        shell: bash
        run: |
          echo "### 校验结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 界面基线 / shared JS 同步 / HTML 副本 / 注入幂等性 / 源码落定门单测 五重校验全部通过" >> $GITHUB_STEP_SUMMARY
