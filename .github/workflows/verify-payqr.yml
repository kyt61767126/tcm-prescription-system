name: Verify Payment QR Integrity

on:
  push:
    branches: [main]
    paths:
      - 'public/images/pay-*.png'
      - 'site-official/images/pay-*.png'
      - 'public/download.html'
      - 'site-official/download.html'
      - 'tools/verify-payqr.cjs'
      - '.github/workflows/verify-payqr.yml'
  pull_request:
    paths:
      - 'public/images/pay-*.png'
      - 'site-official/images/pay-*.png'
      - 'public/download.html'
      - 'site-official/download.html'
      - 'tools/verify-payqr.cjs'
      - '.github/workflows/verify-payqr.yml'
  workflow_dispatch:

jobs:
  verify-payqr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify payment QR hashes
        run: node tools/verify-payqr.cjs
