name: Sync Shared Modules

# 当 shared/ 目录下的任何文件变更时，自动同步到所有分发目录
# 覆盖范围：10 个业务 JS + calculate-hash.js + license/ + electron/ + res/xml/ + vendor/
# 由 tools/sync-all.ps1 统一处理（跨平台 pwsh，Windows + Linux 均可运行）
on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量同步（忽略是否变更）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # 避免 CI 触发的提交导致循环
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync shared modules to distribution directories
        shell: pwsh
        run: |
          ./tools/sync-all.ps1

      - name: Commit and push if changed
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "=== No changes, skipping commit ==="
          else
            git commit -m "chore(sync): 自动同步 shared/ 模块到分发目录 [skip ci]

          由 GitHub Actions sync-shared-modules 工作流自动生成。
          源文件: shared/**
          同步脚本: tools/sync-all.ps1
          分发目标: 13+ 个目录 (cloud + offline)"
            git push
            echo "=== 已推送同步提交 ==="
          fi

      - name: Summary
        shell: bash
        run: |
          echo "### 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ sync-all.ps1 已执行" >> $GITHUB_STEP_SUMMARY
