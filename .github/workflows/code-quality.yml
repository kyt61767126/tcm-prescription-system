name: Code Quality Check

# PR 检查：验证 shared/ 源文件与分发目录一致性，防止手动修改分发文件导致不一致
# 由 tools/sync-all.ps1 -VerifyOnly 统一处理（跨平台 pwsh）
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-consistency:
    runs-on: ubuntu-latest
    name: 检查 shared/ 模块一致性

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared modules consistency
        shell: pwsh
        run: |
          ./tools/sync-all.ps1 -VerifyOnly

      # ★ 2026-09-17 十二道门 CI 侧兜底：functions/ 未定义常量静态扫描
      #   （pre-push ⑫ 同款；ReferenceError 是运行时错误，node --check 查不出）
      - name: Scan undefined constants in functions/
        run: node tools/scan-undefined-consts.cjs

      - name: Check for junk files
        run: |
          echo "=== 检查垃圾文件 ==="
          # 检查常见的 PowerShell 误创建垃圾文件模式
          JUNK=$(find . -maxdepth 2 -type f \( -name "rcmain*" -o -name "tem.IO*" \) 2>/dev/null || true)
          if [ -n "$JUNK" ]; then
            echo "❌ 发现垃圾文件:"
            echo "$JUNK"
            exit 1
          fi
          echo "✅ 未发现垃圾文件"

      - name: Check index.html title consistency
        shell: bash
        run: |
          echo "=== 检查 index.html title 一致性 ==="
          ERROR=0
          check_title() {
            local file="$1"
            local expected="$2"
            local actual=$(grep -oP '<title>\K[^<]+' "$file" | head -1)
            if [ "$actual" != "$expected" ]; then
              echo "❌ $file title='$actual' (期望: '$expected')"
              ERROR=1
            else
              echo "✅ $file title='$actual'"
            fi
          }
          # ★ 2026-09-24 P1：修正与现行权威源一致的 title 断言。
          #   旧断言引用已删除目录 desktop_geren（db-geren/db-geren 已合并为 db-offline），
          #   且两个 title 期望值早已随产品改名（定制→诊所管理系统 V1.0.0 / 云端→云端标准版），
          #   导致任何 PR 必红。云桌面副本由 sync-html 生成（另设门禁），不在此重复断言。
          check_title "app_project/db-offline/desktop/index.html" "惠康中医诊所管理系统 V1.0.0"
          check_title "public/index.html" "惠康中医-云端标准版"
          if [ $ERROR -eq 1 ]; then exit 1; fi

      - name: Check legacy android directories
        shell: bash
        run: |
          echo "=== 检查 legacy 离线目录（db-dingzhi/db-geren 已合并为 db-offline）==="
          for dir in app_project/db-dingzhi app_project/db-geren; do
            if [ -d "$dir" ]; then
              echo "⚠️  $dir 存在(legacy目录,已合并到 db-offline/)"
            fi
          done
          echo "✅ legacy 目录检查完成"

      - name: Check .bak file residues
        shell: bash
        run: |
          echo "=== 检查 .bak 残留文件 ==="
          # P3-3: 扫描代码中的 .bak 文件残留（编辑工具或手动备份遗留）
          # 排除 node_modules、build 输出、.git 等目录
          BAK_FILES=$(find . -type f -name "*.bak" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -not -path "*/dist/*" \
            -not -path "*/app/build/*" \
            2>/dev/null || true)
          if [ -n "$BAK_FILES" ]; then
            echo "❌ 发现 .bak 残留文件（请删除后提交）:"
            echo "$BAK_FILES"
            exit 1
          fi
          echo "✅ 未发现 .bak 残留文件"

      - name: Summary
        run: |
          echo "### 代码质量检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ shared/ 模块一致性检查通过" >> $GITHUB_STEP_SUMMARY
          echo "✅ functions/ 未定义常量扫描通过" >> $GITHUB_STEP_SUMMARY
          echo "✅ 垃圾文件检查通过" >> $GITHUB_STEP_SUMMARY
          echo "✅ index.html title 一致性检查通过" >> $GITHUB_STEP_SUMMARY
          echo "✅ legacy 目录检查通过" >> $GITHUB_STEP_SUMMARY
          echo "✅ .bak 残留文件检查通过" >> $GITHUB_STEP_SUMMARY
