<!DOCTYPE html>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; overflow:hidden; }

  .veil {

      rgba(60,0,0,0.28) 20%,
      rgba(48,0,0,0.48) 38%,
      rgba(40,0,0,0.68) 56%,
      rgba(32,0,0,0.86) 100%);
  }
  .glow {
    position:absolute; left:50%; top:140px; transform:translateX(-50%);
    width:940px; height:500px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(40,0,0,0.58) 0%, rgba(40,0,0,0.30) 46%, rgba(40,0,0,0) 72%);

  .top-scrim {

  .d-num {

  .d-tag { margin-top:10px; font-size:20px; font-weight:700; color:rgba(255,235,180,.92); letter-spacing:5px; }

  .price-card {
    margin-top:26px; width:100%;

    padding:24px 22px 28px;

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .item {

  .contact {

</style>
