<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; overflow:hidden; }
  body {
    font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .poster { position:relative; width:1080px; height:1440px; overflow:hidden; background:#6d0a0a; }
  .bg {
    position:absolute; inset:0;
    background-image:url('bg_portrait.jpg');
    background-size:cover; background-position:center top;
  }
  .veil {
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(60,0,0,0.10) 0%,
      rgba(60,0,0,0.30) 24%,
      rgba(48,0,0,0.50) 44%,
      rgba(40,0,0,0.68) 60%,
      rgba(32,0,0,0.84) 100%);
  }
  .glow {
    position:absolute; left:50%; top:250px; transform:translateX(-50%);
    width:960px; height:580px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(40,0,0,0.60) 0%, rgba(40,0,0,0.32) 46%, rgba(40,0,0,0) 72%);
  }
  .top-scrim {
    position:absolute; top:0; left:0; right:0; height:300px;
    background:linear-gradient(180deg, rgba(48,0,0,0.74) 0%, rgba(48,0,0,0.52) 55%, rgba(48,0,0,0) 100%);
  }
  .content { position:relative; z-index:3; height:100%; display:flex; flex-direction:column; align-items:center; padding:46px 56px 40px; }

  .kicker {
    font-size:23px; font-weight:700; color:#FFDD8C; letter-spacing:8px;
    text-shadow:0 2px 10px rgba(0,0,0,.68);
  }

  .brand {
    margin-top:20px; font-size:88px; line-height:1.14; font-weight:900; letter-spacing:3px;
    background:linear-gradient(180deg,#FFFDF0 0%,#FFEBAE 32%,#FFCF4D 64%,#E29C0F 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.78)) drop-shadow(0 0 34px rgba(255,190,50,.62));
  }
  .brand-rule { margin-top:20px; display:flex; align-items:center; justify-content:center; gap:12px; }
  .brand-rule span { width:152px; height:2px; }
  .brand-rule span:first-child { background:linear-gradient(90deg, rgba(255,215,94,0), #FFD75E); }
  .brand-rule span:last-child { background:linear-gradient(90deg, #FFD75E, rgba(255,215,94,0)); }
  .brand-rule i { width:10px; height:10px; background:#FFD75E; transform:rotate(45deg); box-shadow:0 0 12px rgba(255,205,60,.95); }
  .brand-sub { margin-top:14px; font-size:19px; font-weight:600; color:rgba(255,231,166,.9); letter-spacing:3px; text-shadow:0 2px 8px rgba(0,0,0,.62); }

  .discount { margin-top:50px; display:flex; align-items:baseline; justify-content:center;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.6)); }
  .d-pre { font-size:38px; font-weight:800; color:#FFE7A6; letter-spacing:2px; margin-right:12px; }
  .d-num {
    font-size:132px; line-height:.86; font-weight:900; font-family:'Segoe UI',sans-serif;
    background:linear-gradient(180deg,#FFFDF0 0%,#FFE793 38%,#FFC42F 66%,#E08E08 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .d-unit { font-size:52px; font-weight:900; color:#FFD75E; margin-left:10px; }
  .d-tag { margin-top:14px; font-size:22px; font-weight:700; color:rgba(255,235,180,.92); letter-spacing:6px; }

  .price-card {
    margin-top:42px; width:100%;
    background:linear-gradient(180deg, rgba(58,4,4,.74) 0%, rgba(38,0,0,.86) 100%);
    border:2px solid rgba(255,205,90,.55); border-radius:24px;
    padding:32px 30px 36px;
    box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,220,140,.22);
  }
  .pc-title { text-align:center; font-size:27px; font-weight:800; color:#FFD868; letter-spacing:5px; margin-bottom:24px; }
  .pc-title span { color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .item {
    background:rgba(255,255,255,.07); border:1px solid rgba(255,205,90,.34); border-radius:15px;
    padding:24px 22px 26px;
  }
  .i-name { font-size:26px; font-weight:800; color:#FFF3D2; letter-spacing:1px; }
  .i-sub { margin-top:6px; font-size:18px; color:rgba(255,231,166,.72); letter-spacing:1px; }
  .i-price { margin-top:14px; display:flex; align-items:baseline; }
  .i-new { font-size:54px; font-weight:900; font-family:'Segoe UI',sans-serif;
    background:linear-gradient(180deg,#FFF6C9,#FFC93F); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .i-unit { font-size:20px; font-weight:700; color:#FFD868; margin-left:6px; }
  .i-old { margin-left:14px; font-size:22px; color:rgba(255,220,180,.55); text-decoration:line-through; font-family:'Segoe UI',sans-serif; }

  .footer { margin-top:auto; width:100%; text-align:center; }
  .f-free { display:inline-block; padding:10px 28px; border-radius:999px; font-size:23px; font-weight:800;
    color:#0B3A20; background:linear-gradient(180deg,#8BF0AE,#22C55E); letter-spacing:2px;
    box-shadow:0 6px 16px rgba(0,0,0,.4); }
  .contact {
    margin-top:22px; width:100%; border-radius:18px;
    background:rgba(24,0,0,.58); border:1.5px solid rgba(255,205,90,.5);
    padding:16px 22px; display:flex; flex-direction:column; gap:9px;
  }
  .c-row { display:flex; align-items:center; justify-content:center; gap:12px; }
  .c-tag {
    flex:0 0 auto; font-size:19px; font-weight:800; color:#5C0A0A; letter-spacing:1px;
    background:linear-gradient(180deg,#FFE9A8,#F5C64B); border-radius:6px; padding:4px 12px;
  }
  .c-val { font-size:27px; font-weight:800; color:#FFF6DA; letter-spacing:0.5px; font-family:'Segoe UI','Microsoft YaHei',sans-serif; }
  .c-val.hi { color:#7CFFB0; font-size:29px; }
  .f-date { margin-top:14px; font-size:18px; color:rgba(255,231,166,.62); letter-spacing:3px; }
</style>
</head>
