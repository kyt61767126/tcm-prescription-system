<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; overflow:hidden; }
  body {
    font-family:'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .poster { position:relative; width:1080px; height:1080px; overflow:hidden; background:#6d0a0a; }
  .bg {
    position:absolute; inset:0;
    background-image:url('bg_square.jpg');
    background-size:cover; background-position:center center;
  }
  .veil {
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(60,0,0,0.10) 0%,
      rgba(60,0,0,0.30) 22%,
      rgba(48,0,0,0.52) 40%,
      rgba(40,0,0,0.70) 58%,
      rgba(32,0,0,0.86) 100%);
  }
  .glow {
    position:absolute; left:50%; top:170px; transform:translateX(-50%);
    width:880px; height:470px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(40,0,0,0.60) 0%, rgba(40,0,0,0.32) 45%, rgba(40,0,0,0) 72%);
  }
  .top-scrim {
    position:absolute; top:0; left:0; right:0; height:196px;
    background:linear-gradient(180deg, rgba(48,0,0,0.66) 0%, rgba(48,0,0,0.44) 52%, rgba(48,0,0,0) 100%);

  .brand {

  .brand-rule { margin-top:12px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .brand-rule span { width:96px; height:1.5px; }
  .brand-rule span:first-child { background:linear-gradient(90deg, rgba(255,215,94,0), #FFD75E); }
  .brand-rule span:last-child { background:linear-gradient(90deg, #FFD75E, rgba(255,215,94,0)); }
  .brand-rule i { width:8px; height:8px; background:#FFD75E; transform:rotate(45deg); box-shadow:0 0 10px rgba(255,205,60,.95); }
  .brand-sub { margin-top:11px; font-size:17px; font-weight:600; color:rgba(255,231,166,.9); letter-spacing:2.5px; text-shadow:0 2px 8px rgba(0,0,0,.6); }

  .d-num {

  .d-tag { margin-top:8px; font-size:20px; font-weight:700; color:rgba(255,235,180,.92); letter-spacing:5px; }

  .price-card {

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .item {

  .contact {
